[project]
name = "ai-streamlit-playground"
version = "0.1.0"
description = "AI Streamlit Playground"
requires-python = "==3.14.*"
dependencies = [
    "altair==6.3.0",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "astroid==4.3.3",
    "attrs==26.1.0",
    "blinker==1.9.0",
    "cachetools==7.2.0",
    "certifi==2026.7.22",
    "cffi==2.1.1",
    "charset-normalizer==3.5.2",
    "click==8.5.0",
    "cryptography==50.0.2",
    "dill==0.4.1",
    "distro==1.9.0",
    "gitdb==4.0.12",
    "gitpython==3.2.0",
    "google-auth==2.59.1",
    "google-genai==2.27.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "ibm-cos-sdk==2.14.3",
    "ibm-cos-sdk-core==2.14.3",
    "ibm-cos-sdk-s3transfer==2.14.3",
    "ibm-watsonx-ai==1.8.0",
    "idna==3.20",
    "iniconfig==2.3.0",
    "isort==9.0.2",
    "jinja2==3.1.6",
    "jiter==0.17.0",
    "jmespath==1.0.1",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "lomond==0.3.4",
    "markupsafe==3.0.3",
    "mccabe==0.7.0",
    "narwhals==2.26.0",
    "numpy==2.5.3",
    "ollama==0.6.3",
    "openai==3.24.0",
    "packaging==26.3",
    "pandas==3.0.6",
    "pillow==12.3.0",
    "platformdirs==4.12.2",
    "pluggy==1.6.0",
    "protobuf==7.36.2",
    "pyarrow==25.0.1",
    "pyasn1==0.6.4",
    "pyasn1-modules==0.4.2",
    "pycparser==3.0",
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "pydantic-settings==2.15.0",
    "pydeck==0.9.3",
    "pylint==4.1.1",
    "pypdf==6.19.0",
    "pytest==9.1.1",
    "python-dateutil==2.9.0.post0",
    "python-docx==1.2.0",
    "python-dotenv==1.2.4",
    "pytz==2026.4",
    "referencing==0.37.0",
    "requests==2.34.2",
    "rpds-py==2026.6.3",
    "rsa==4.9.1",
    "six==1.17.0",
    "smmap==5.0.3",
    "sniffio==1.3.1",
    "streamlit==1.64.0",
    "tabulate==0.10.0",
    "tenacity==9.1.4",
    "toml==0.10.2",
    "tomlkit==0.15.1",
    "tornado==6.5.10",
    "tqdm==4.70.1",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "tzdata==2026.4",
    "urllib3==2.8.0",
    "websockets==16.1.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.9",
]

[tool.pylint."messages_control"]
disable = ["line-too-long"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.coverage.run]
source = ["app", "core", "models", "providers", "views"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
